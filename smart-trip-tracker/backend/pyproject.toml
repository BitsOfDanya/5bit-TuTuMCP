[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-trip-tracker-backend"
version = "0.1.0"
description = "Isolated MVP for tracking the price of a complete trip"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
