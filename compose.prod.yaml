name: tutumcp

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-python-healthcheck: &python-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  caddy:
    <<: *runtime
    cap_add:
      - NET_BIND_SERVICE
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-bitsofdanya/5bit-tutumcp}-caddy:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - edge
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    <<: *runtime
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-bitsofdanya/5bit-tutumcp}-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/tutumcp.db
      AI_SERVICE_URL: http://ai-service:8020
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-90}
      MAX_DOCUMENT_SIZE_BYTES: ${MAX_DOCUMENT_SIZE_BYTES:-10485760}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-tutumcp_session}
      AUTH_DEBUG: "false"
      AUTH_CODE_TTL_SECONDS: ${AUTH_CODE_TTL_SECONDS:-300}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-604800}
    volumes:
      - backend_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - internal
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
    stop_grace_period: 30s

  ai-service:
    <<: *runtime
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-bitsofdanya/5bit-tutumcp}-ai-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/ai-service.Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      DOCUMENT_EXTRACTION_MODEL: ${DOCUMENT_EXTRACTION_MODEL:-gpt-5.6-luna}
      AGENT_SYSTEM_PROMPT: ${AGENT_SYSTEM_PROMPT:-Be concise, friendly, and accurate.}
      MAX_DOCUMENT_SIZE_BYTES: ${MAX_DOCUMENT_SIZE_BYTES:-10485760}
      INTERNAL_API_TOKEN: ${AI_SERVICE_TOKEN:-}
      CONSTRAINT_NEGOTIATOR_URL: http://constraint-negotiator:8010
      CONSTRAINT_NEGOTIATOR_TIMEOUT_SECONDS: ${CONSTRAINT_NEGOTIATOR_TIMEOUT_SECONDS:-45}
      APP_HOST: 0.0.0.0
      APP_PORT: 8020
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - internal
    depends_on:
      constraint-negotiator:
        condition: service_healthy
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).read()"]
    stop_grace_period: 30s

  constraint-negotiator:
    <<: *runtime
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY:-bitsofdanya/5bit-tutumcp}-constraint-negotiator:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/constraint-negotiator.Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      AGENT_SYSTEM_PROMPT: ${AGENT_SYSTEM_PROMPT:-Be concise, friendly, and accurate.}
      TUTU_MCP_URL: ${TUTU_MCP_URL:-https://mcp.tutu.ru/mcp}
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      APP_DEBUG: "false"
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://travel.example.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NEGOTIATOR_RATE_LIMIT_PER_MINUTE: ${NEGOTIATOR_RATE_LIMIT_PER_MINUTE:-60}
      MCP_TOOLS_CACHE_TTL_SECONDS: ${MCP_TOOLS_CACHE_TTL_SECONDS:-300}
      MCP_CONNECT_TIMEOUT_SECONDS: ${MCP_CONNECT_TIMEOUT_SECONDS:-10}
      MCP_READ_TIMEOUT_SECONDS: ${MCP_READ_TIMEOUT_SECONDS:-90}
      MCP_WRITE_TIMEOUT_SECONDS: ${MCP_WRITE_TIMEOUT_SECONDS:-30}
      MCP_POOL_TIMEOUT_SECONDS: ${MCP_POOL_TIMEOUT_SECONDS:-10}
      MCP_OPERATION_TIMEOUT_SECONDS: ${MCP_OPERATION_TIMEOUT_SECONDS:-120}
      MCP_MAX_ATTEMPTS: ${MCP_MAX_ATTEMPTS:-3}
      MCP_RETRY_BASE_DELAY_SECONDS: ${MCP_RETRY_BASE_DELAY_SECONDS:-0.5}
      MCP_RETRY_MAX_DELAY_SECONDS: ${MCP_RETRY_MAX_DELAY_SECONDS:-4}
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - internal
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).read()"]
    stop_grace_period: 30s

networks:
  edge:
  internal:

volumes:
  backend_data:
  caddy_data:
  caddy_config:
