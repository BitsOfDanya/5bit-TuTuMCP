name: Production images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ai-service/pyproject.toml
            constraint-negotiator/requirements.lock.txt
            trip-rescue/requirements.lock.txt
            smart-trip-tracker/backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e './backend[dev]'
          cd backend
          .venv/bin/ruff check app tests
          .venv/bin/python -m pytest -q
          .venv/bin/python -m alembic check

      - name: Test AI service
        run: |
          python -m venv ai-service/.venv
          ai-service/.venv/bin/pip install -e './ai-service[dev]'
          cd ai-service
          .venv/bin/ruff check app tests
          .venv/bin/python -m pytest -q

      - name: Test constraint negotiator
        run: |
          python -m venv constraint-negotiator/.venv
          constraint-negotiator/.venv/bin/pip install -r constraint-negotiator/requirements.lock.txt
          cd constraint-negotiator
          .venv/bin/python -m pytest -q

      - name: Test Trip Rescue and Decision Intelligence
        run: |
          python -m venv trip-rescue/.venv
          trip-rescue/.venv/bin/pip install -r trip-rescue/requirements.lock.txt
          cd trip-rescue
          .venv/bin/python -m pytest -q

      - name: Test Smart Trip Tracker
        run: |
          python -m venv smart-trip-tracker/backend/.venv
          smart-trip-tracker/backend/.venv/bin/pip install -e './smart-trip-tracker/backend[dev]'
          cd smart-trip-tracker/backend
          .venv/bin/ruff check app tests
          .venv/bin/python -m pytest -q

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  build:
    name: Build ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: caddy
            dockerfile: deploy/caddy.Dockerfile
          - service: backend
            dockerfile: deploy/backend.Dockerfile
          - service: ai-service
            dockerfile: deploy/ai-service.Dockerfile
          - service: constraint-negotiator
            dockerfile: deploy/constraint-negotiator.Dockerfile
          - service: trip-rescue
            dockerfile: deploy/trip-rescue.Dockerfile
          - service: smart-trip-tracker
            dockerfile: deploy/smart-trip-tracker.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
